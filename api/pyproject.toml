[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeaudit-api"
version = "0.1.0"
description = "HTTP API for CodeAudit."
requires-python = ">=3.11"
dependencies = [
    "codeaudit-core",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
