[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeaudit-core"
version = "0.1.0"
description = "Deterministic engine that measures code authored per developer, language and time."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/codeaudit_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
