services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: codeaudit
      POSTGRES_PASSWORD: codeaudit
      POSTGRES_DB: codeaudit
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db-data:
