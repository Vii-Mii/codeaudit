<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codeaudit · the code you ship, at a glance</title>
    <meta name="author" content="Vijayaraj" />
    <meta
      name="description"
      content="Free, open-source stats for any GitHub profile: lines written, languages, streaks and a README card."
    />
    <meta property="og:title" content="codeaudit · the code you ship, at a glance" />
    <meta
      property="og:description"
      content="Free, open-source stats for any GitHub profile: lines written, languages, streaks and a README card."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#5eead4" />
    <!-- Favicon: mint tile with a ">_" prompt, matching the header mark. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235eead4'/%3E%3Cpath d='M9 10l7 6-7 6' fill='none' stroke='%2304100e' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 23h6' fill='none' stroke='%2304100e' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before first paint to avoid a light/dark flash.
      try {
        const t = localStorage.getItem("codeaudit:theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
